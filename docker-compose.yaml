services:
  mongo:
    image: mongo:7
    container_name: mongo-talhao
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-talhao-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend-talhao
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - mongo
    restart: unless-stopped

  servidor:
    build: ./servidor
    container_name: servidor-talhao
    environment:
      BACKEND_URL: http://backend:8081
      BIND_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    stdin_open: true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-talhao-data: