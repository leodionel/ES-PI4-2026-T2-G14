
# Nome da aplicacao
spring.application.name=talhao

# Porta do backend
server.port=8081

# Conexao com MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/talhao}

# Criacao automatica dos indices MongoDB
spring.data.mongodb.auto-index-creation=true

# Origens permitidas para o Flutter Web
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ==========================================
# RECUPERACAO DE SENHA - CONFIGURACAO SMTP
# ==========================================

# Servidor de e-mail
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}

# Credenciais fornecidas por variaveis de ambiente
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

# Autenticacao SMTP e STARTTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Limites de tempo para a conexao SMTP
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Endereco utilizado como remetente
app.mail.remetente=${MAIL_FROM:}

# URL da futura tela de redefinicao de senha
app.recuperacao.url=${RECUPERACAO_URL:}
