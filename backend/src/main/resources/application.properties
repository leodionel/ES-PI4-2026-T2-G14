
# Nome da aplicação
spring.application.name=talhao

# Porta do backend Spring Boot
server.port=8081

# Conexao com MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/talhao}

# Permite criar os indices declarados nos modelos
spring.data.mongodb.auto-index-creation=true

# Enderecos autorizados para o Flutter Web
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}